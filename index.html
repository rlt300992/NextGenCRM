<div id="app" class="h-full w-full overflow-hidden flex flex-col bg-dark-bg text-zinc-100">

function complRows() {

}
function queueItemsAll() {
    const out = [];
    Object.keys(state.deals).forEach(id => {
        const d = state.deals[id];
        d.timeline.forEach(e => {
            if (!e.conf) return;
            Object.keys(e.conf).forEach(tag => {
                if (tagOn(tag) && e.tags.includes(tag) && e.conf[tag] < thr('Signal tags') && !(e.reviewed && e.reviewed[tag]))
                    out.push({ key: 't:' + eid(e) + ':' + tag, type: 'tag', dealId: id, rep: d.owner, e, tag, conf: e.conf[tag] });

        });
    });
    return out;
}
function hygieneStats() {
    const keys = ['Stage', 'Close date', 'Deal amount', 'Competitor', 'Next step'];
    const rows = complRows();
    const base = portRows();
    const val = (r, k) => k === 'Stage' ? r.stage : k === 'Close date' ? r.close : k === 'Deal amount' ? r.acv : k === 'Competitor' ? r.comp : r.next;
    const comp = keys.map(k => {
        const filled = base.filter(r => { const v = val(r, k); return v !== undefined && v !== null && v !== '' && v !== '—'; }).length;
        return { k, pct: Math.round(filled / base.length * 100) };
    });
    const completeness = Math.round(comp.reduce((a, c) => a + c.pct, 0) / comp.length);
    const stale = rows.filter(r => r.stale).length;
    const stalePct = Math.round(stale / rows.length * 100);
    const review = queueItemsAll().length;
    const approvals = Object.values(state.deals).reduce((a, d) => a + d.fields.filter(f => f.status === 'pending').length, 0);
    const backlog = review + approvals;
    const score = Math.max(0, Math.min(100, Math.round(completeness * 0.6 + (100 - stalePct) * 0.25 + (100 - Math.min(100, backlog * 10)) * 0.15)));
    return { comp, completeness, stale, stalePct, review, approvals, backlog, score, rows };
}

const repContrib = r => r.cat === 'commit' ? r.acv : r.cat === 'best' ? 0.5 * r.acv : 0;
const aiContrib = r => r.acv * r.ai / 100;
function $k(v) { const a = Math.abs(v), sg = v < 0 ? '-' : ''; return a >= 1000 ? sg + '$' + (a / 1000).toFixed(2) + 'M' : sg + '$' + Math.round(a) + 'k'; }
function gapFmt(g) { return g >= 0 ? $k(g) : '+' + $k(-g); }
function fcTotals(rows) {
    const closed = Object.values(CLOSED_BY_REP).reduce((a, b) => a + b, 0);
    const sum = f => rows.filter(f).reduce((a, r) => a + r.acv, 0);
    const commit = sum(r => r.cat === 'commit'), best = sum(r => r.cat === 'best'), pipe = sum(r => r.cat === 'pipeline');
    const aiOpen = rows.reduce((a, r) => a + aiContrib(r), 0);
    const repCall = closed + commit + 0.5 * best;
    const ai = closed + aiOpen;
    return { closed, commit, best, pipe, aiOpen, repCall, ai, gap: repCall - ai, gapPct: (repCall - ai) / repCall * 100 };
}

function applyResolve(dealId, label, action, val) {
    const d = state.deals[dealId];
    const f = d.fields.find(x => x.label === label);
    if (!f || f.status !== 'pending') return null;
    const old = f.value;
    let nv = f.proposed, kind, txt;
    if (action === 'accept') { kind = 'acc'; txt = 'You accepted: ' + label + ' ' + old + ' ➔ ' + nv; }
    else if (action === 'edit') { nv = (val || '').trim() || f.proposed; kind = 'edit'; txt = 'You edited the AI proposal: ' + label + ' ' + old + ' ➔ ' + nv + ' (AI proposed ' + f.proposed + ')'; }
    else { kind = 'rej'; nv = old; txt = 'You rejected the AI proposal for ' + label + ' and kept ' + old; logCorrection('Field proposals rejected'); }
    f.value = nv; f.status = 'approved'; delete f.proposed; delete f.editing;
    if (label === 'Stage') d.stage = nv;
    if (label === 'Win probability') d.prob = parseInt(nv, 10) || d.prob;
    fieldStat(label, kind);
    d.timeline.unshift({ when: 'Just now', today: true, src: 'Action Queue', text: txt, tags: [] });
    const pf = state.feed.find(x => x.dealId === dealId && x.field === label && x.outcome === 'Pending approval');
    if (pf) { pf.outcome = action === 'reject' ? 'Rejected' : 'Applied'; pf.approver = actor(); if (action === 'edit') pf.after = nv; }
    else pushFeed({ src: 'crm', kind: 'log', dealId, rep: d.owner, title: 'CRM proposal ' + (action === 'reject' ? 'rejected' : action === 'edit' ? 'edited and applied' : 'accepted') + ': ' + d.name, text: txt, mutation: label + ': ' + (action === 'reject' ? 'kept ' + old : nv), field: label, before: old, after: nv, evidence: 'AI proposal reviewed by a person', approver: actor(), outcome: action === 'reject' ? 'Rejected' : 'Applied' });
    return txt;
}

}

function proposeField(dealId, label, to, conf) {
    const d = state.deals[dealId];
    const f = d.fields.find(x => x.label === label);
    if (!f || f.status === 'pending') return null;
    const sure = conf === undefined || conf >= thr(label);
    if (state.fieldPolicy[label] === 'auto' && sure) {
        const old = f.value;
        f.value = to; f.status = 'auto';
        if (label === 'Stage') d.stage = to;
        d.timeline.unshift({ when: 'Just now', today: true, src: 'Policy', text: 'Auto-applied by RevOps policy: ' + label + ' ' + old + ' ➔ ' + to, tags: [] });
        return 'auto';
    }
    f.status = 'pending'; f.proposed = to;
    return 'pending';
}

function viewActionQueue() {
    const all = state.tasks.filter(t => !t.snoozedUntil && !t.isFollowUp);
    const f = state.qFilter;
    const isFu = t => t.type === 'postcall' || t.type === 'followup';
    const counts = { all: all.length, risks: all.filter(t => t.type === 'risk').length, followups: all.filter(isFu).length, stakeholders: all.filter(t => t.type === 'multithread').length };
    const inFilter = t => f === 'all' || (f === 'risks' && t.type === 'risk') || (f === 'followups' && isFu(t)) || (f === 'stakeholders' && t.type === 'multithread');
    const byScore = (a, b) => b.score - a.score;
    const filtered = all.filter(inFilter);
    const ordered = [...filtered.filter(t => t.due.group === 'today').sort(byScore), ...filtered.filter(t => t.due.group !== 'today').sort(byScore)];
    const top = ordered.slice(0, 5);
    const more = ordered.length - top.length;
    const later = state.tasks.filter(t => t.snoozedUntil || t.isFollowUp);
    const fuDone = state.done.filter(d => d.type === 'followup' || d.type === 'postcall').length;
    const fuPending = counts.followups;

    let list = '', lastGroup = null;
    top.forEach((t, i) => {
        const g = t.due.group === 'today' ? 'Today' : 'This week';
        if (g !== lastGroup) { list += `<h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider ${lastGroup ? 'pt-2' : ''}">${g}</h2>`; lastGroup = g; }

function onDraftInput(id, val, from) {

function snoozeTask(id, opt) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    const now = new Date();
    if (opt === 'tomorrow') {
        t.snoozedUntil = 'tomorrow, 9:00 AM';
    } else {
        const until = new Date(now.getTime() + opt * 60000);
        t.snoozedUntil = until.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }
    if (state.selTask === id) state.selTask = null;
    showToast('Snoozed until ' + t.snoozedUntil);
    renderSidebar();
    renderMainCanvas();
    renderRightContext();
}

/* ---------- Capture stream (Engine 1) ---------- */
function pushFeed(item) {
    const d = item.dealId && state.deals[item.dealId];
    const entry = Object.assign({ id: 'f-' + Date.now() + '-' + Math.floor(Math.random() * 1000), ts: Date.now(), open: false, approver: 'AI (auto)', outcome: 'Applied', rep: d ? d.owner : '—' }, item);
    state.feed.unshift(entry);
    state.captured += 1;
    return entry;
}
function genItem() {
    const ids = Object.keys(state.deals);
    state.genN = (state.genN || 0) + 1;
    const id = ids[state.genN % ids.length], d = state.deals[id];
    const eng = state.comm[id] ? state.comm[id].people.filter(p => p.status === 'engaged') : [];
    const who = eng.length ? eng[state.genN % eng.length].name : 'the buyer';
    const T = [
        { src: 'gmail', kind: 'field', title: 'Reply from ' + who + ' (' + d.name + ')', text: 'Email parsed and matched to the open deal.', mutation: 'Last Activity ➔ today', field: 'Last activity', before: '2 days ago', after: 'Today', evidence: 'Email thread with ' + who, conf: 95 },
        { src: 'calendar', kind: 'field', title: 'Meeting booked with ' + who + ' (' + d.name + ')', text: 'Calendar invite matched to the deal.', mutation: 'Next Meeting ➔ this week', field: 'Next meeting', before: '—', after: 'This week', evidence: 'Calendar invite', conf: 96 },
        { src: 'zoom', kind: 'summary', title: 'Call ended: ' + d.name + ' check-in (15 min)', text: 'Short summary written to the opportunity.', mutation: 'Meeting note attached', field: 'Call summary', before: '—', after: 'Short summary', evidence: 'Call transcript, 15 minutes', conf: 91 },
        { src: 'slack', kind: 'field', title: '#deal-' + d.name.split(' ')[0].toLowerCase() + ': update from the team', text: 'Slack message logged as a deal note.', mutation: 'Deal note added', field: 'Deal note', before: '—', after: 'Added', evidence: 'Slack message', conf: 88 }
    ];
    return Object.assign({ dealId: id, generic: true }, T[state.genN % T.length]);
}
function streamTick(force) {
    if (state.paused && force !== true) return;
    let base, generic = false;
    if (state.poolIdx < FEED_POOL.length) { base = FEED_POOL[state.poolIdx]; state.poolIdx += 1; }
    else {
        if (force !== true) { state.genTick = (state.genTick || 0) + 1; if (state.genTick % 2) return; }
        base = genItem(); generic = true;
    }
    const d = state.deals[base.dealId];
    const tl = { when: 'Just now', today: true, src: SRC[base.src].label, text: base.title + '. ' + base.mutation, tags: [] };
    if (d) d.timeline.unshift(tl);
    const entry = pushFeed(Object.assign({}, base, { tlUid: d ? eid(tl) : undefined }));
    if (base.propose) {
        const r = proposeField(base.dealId, base.propose.label, base.propose.to, base.propose.conf);
        entry.outcome = r === 'pending' ? 'Pending approval' : 'Applied';
        entry.approver = r === 'auto' ? 'Policy (auto)' : 'AI (proposal)';
        if (r === 'pending' && currentPersona === 'ae') showToast('New CRM change to approve on ' + d.name);
        if (state.openDealId === base.dealId) refreshDeal();
    }
    const nt = generic ? null : state.tasks.find(t => t.dealId === base.dealId && !t.isFollowUp && !t.snoozedUntil);
    if (nt) {
        nt.isNew = true; nt.newSignal = base.title;
        nt.breakdown.immediacy = Math.min(100, nt.breakdown.immediacy + 3);
        nt.score = calcScore(nt.breakdown);
        if (currentModule === 'actionQueue' && currentPersona === 'ae') showToast('New signal on ' + d.name + '. Queue re-ranked.');
    }
    if (currentModule === 'captureFeed') refreshFeed();
    if (currentPersona === 'cro') { renderSidebar(); renderCroPanel(); }
    if (currentPersona === 'revops') { renderSidebar(); renderOpsPanel(); if (['hygiene', 'reviewQueue', 'aiTelemetry', 'compliance'].includes(currentModule)) renderMainCanvas(); }
    if (currentModule === 'pipeline') rerenderQueue();
    if (currentModule === 'actionQueue') {
        const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('#mainCanvas textarea');
        if (!typing) rerenderQueue();
        renderRightContext();
    }
}

function contactInfo(acct, p) {
    const d = state.deals[acct];
    const known = p.id !== 'champ';
    const email = known ? p.name.toLowerCase().replace(/[^a-z ]/g, '').trim().replace(/\s+/g, '.') + '@' + d.domain : null;
    let n = 0; for (const ch of p.name) n += ch.charCodeAt(0);
    const phone = known ? '+1 (415) 555-01' + String(n % 100).padStart(2, '0') : null;
    let last = LAST[p.id] || 'Never';
    if (p.status === 'engaged' && last === 'Never') last = 'Just now';
    const generic = p.status === 'engaged' ? ['Replied to the latest email thread', 'Joined a scheduled meeting']
        : p.status === 'cooling' ? ['No reply to the last 2 emails', 'Missed the last scheduled sync']
        : p.status === 'queued' ? ['Intro outreach drafted and queued'] : ['No interactions logged yet'];
    return { email, phone, last, activity: [p.note, ...generic] };
}

function engagePerson(acct, pid) {
    const p = state.comm[acct].people.find(x => x.id === pid);
    if (!p || p.status === 'queued') return;
    const deal = state.deals[acct];
    const before = coverageFor(acct);
    p.status = 'queued';
    p.note = 'Outreach drafted • in your Action Queue';
    const bd = { immediacy: 70, impact: 92, size: Math.min(100, 50 + Math.round(deal.acv / 8)) };
    state.tasks.push({
        id: `mt-${acct}-${pid}`, dealId: acct, type: 'multithread', link: { acct, pid },
        headline: `Engage ${p.name} (${p.role})`,
        reasons: [`$${deal.acv}k ACV`, `${p.role} not engaged`, p.id === 'champ' ? 'No technical contact' : 'No direct contact'],
        breakdown: bd, score: calcScore(bd), due: { label: 'Due Fri', group: 'week' },
        why: `Closes a multi-threading gap on a $${deal.acv}k deal`,
        account: `${deal.name} ($${deal.acv}k ACV)`, title: `Multi-Thread • Engage ${p.role}`,
        desc: `${p.name} (${p.title}) is a ${p.role} with no active relationship. Intro outreach drafted from deal context.`,
        actionType: `Intro Outreach to ${p.name} (${p.role})`, channel: 'Email + Calendar Invite',
        draft: p.intro,
        stageUpdate: `Committee Coverage: ${before.engaged} of ${before.total} ➔ ${before.engaged + 1} of ${before.total}`,
        crmMutations: [`Logs outreach to ${p.name}`, 'Adds the contact to the buying committee'],
        msg: { to: p.id === 'champ' ? 'Alex Moreno (introduction request)' : `${p.name} (${p.title})`, channel: 'Email + calendar invite', subject: 'Quick introduction', also: [] },

        transcriptSnippet: p.evidence
    });
    { const mt = state.tasks[state.tasks.length - 1]; if (draftMode('multithread') === 'auto') mt.autoAt = Date.now() + 45000; }
    showToast('Outreach drafted and added to your Action Queue');
    renderSidebar(); renderMainCanvas(); renderRightContext();
    refreshDeal();
}

/* ---------- AI Review Queue (#3) ---------- */
function setRq(k, v) { state.rq[k] = v; renderMainCanvas(); }
function toggleRq(key) { if (state.rq.sel[key]) delete state.rq.sel[key]; else state.rq.sel[key] = true; renderMainCanvas(); }
function rqVisible() {
    const f = state.rq;
    return queueItemsAll().filter(i => (f.rep === 'all' || i.rep === f.rep) && (f.type === 'all' || i.type === f.type) && i.conf <= parseInt(f.max, 10));
}
function rqSelectAll() { const v = rqVisible(); const all = v.every(i => state.rq.sel[i.key]); v.forEach(i => { if (all) delete state.rq.sel[i.key]; else state.rq.sel[i.key] = true; }); renderMainCanvas(); }
function rqApproveOne(it) {
    if (it.type === 'tag') { it.e.reviewed = it.e.reviewed || {}; it.e.reviewed[it.tag] = true; auditCorr(it.dealId, 'Low-confidence tag approved', 'Signal tag', TAGS[it.tag].label, 'Approved', 'RevOps (you)'); }
    else { it.p.roleReviewed = true; auditCorr(it.dealId, 'Low-confidence role approved: ' + it.p.name, 'Contact role', it.p.role, it.p.role + ' (confirmed)', 'RevOps (you)'); }
    delete state.rq.sel[it.key];
}
function rqRejectOne(it) {
    if (it.type !== 'tag') return false;
    it.e.tags = it.e.tags.filter(t => t !== it.tag);
    if (state.tagStats[it.tag]) state.tagStats[it.tag].dismissed += 1;
    logCorrection('Tags dismissed');
    auditCorr(it.dealId, 'Low-confidence tag rejected', 'Signal tag', TAGS[it.tag].label, 'Removed', 'RevOps (you)');
    delete state.rq.sel[it.key];
    return true;
}
function rqFind(key) { return queueItemsAll().find(i => i.key === key); }
function rqApprove(key) { if (!can('review')) return; const it = rqFind(key); if (!it) return; rqApproveOne(it); showToast('Approved'); afterCorrection(); }
function rqReject(key) { if (!can('review')) return; const it = rqFind(key); if (!it) return; if (rqRejectOne(it)) { showToast('Rejected. Logged as an AI correction.'); afterCorrection(); } }
function rqRole(key, val) {
    if (!can('review')) return; const it = rqFind(key); if (!it || it.type !== 'role' || it.p.role === val) return;
    const was = it.p.role; it.p.role = val; it.p.roleReviewed = true; logCorrection('Roles or status changed');
    auditCorr(it.dealId, 'Role corrected by RevOps: ' + it.p.name, 'Contact role', was, val, 'RevOps (you)');
    delete state.rq.sel[key]; showToast('Role updated. Logged as an AI correction.'); afterCorrection();
}
function rqBulk(action) {
    if (!can('review')) return;
    const keys = Object.keys(state.rq.sel); let n = 0;
    keys.forEach(k => { const it = rqFind(k); if (!it) return; if (action === 'approve') { rqApproveOne(it); n++; } else if (rqRejectOne(it)) n++; });
    showToast(n ? n + ' item' + (n === 1 ? '' : 's') + (action === 'approve' ? ' approved' : ' rejected') : 'Nothing to ' + action + ' (roles cannot be bulk rejected)');
    afterCorrection();
}

/* ---------- AI Telemetry (#8) ---------- */
function viewAiTelemetry() {
    const sent = Object.values(state.sendStats).reduce((a, v) => a + v.sent, 0);
    const edited = Object.values(state.sendStats).reduce((a, v) => a + v.edited, 0);
    const unedited = Math.round((sent - edited) / sent * 100);
    const corr = Object.values(state.corrections).reduce((a, v) => a + v, 0);
    const tagKept = (() => { const ks = Object.keys(state.tagStats).filter(k => state.tagStats[k].extracted); const e = ks.reduce((a, k) => a + state.tagStats[k].extracted, 0), d = ks.reduce((a, k) => a + state.tagStats[k].dismissed, 0); return Math.round(100 - d / e * 100); })();
    const actions = sent + state.captured;
    const cost = Math.round(MODEL_COST[state.models.extraction] * 0.3 + MODEL_COST[state.models.drafting] * 0.5 + MODEL_COST[state.models.scoring] * 0.2);
    const reps = REP_SEED.map(r => {
        const live = r.rep === ME;
        const a = r.actions + (live ? state.liveSent : 0);
        const u = live ? Math.round(((r.actions * r.unedited / 100) + (state.liveSent - state.liveEdited)) / a * 100) : r.unedited;
        return { rep: r.rep, team: r.team, a, u, c: r.corrections + (live ? Object.values(state.corrections).reduce((x, y) => x + y, 0) - Object.values(CORR_SEED).reduce((x, y) => x + y, 0) : 0), hrs: r.hrs };
    });
    const teams = TEAMS.map(t => { const rr = reps.filter(r => r.team === t); const a = rr.reduce((x, r) => x + r.a, 0); return { t, n: rr.length, a, u: Math.round(rr.reduce((x, r) => x + r.u * r.a, 0) / a), hrs: (rr.reduce((x, r) => x + r.hrs, 0) / rr.length).toFixed(1) }; });
    const trend = [...WEEKLY_UNEDITED, unedited];
    return `
    <div class="p-6 space-y-6 fade-in">
        ${pageHead('AI Telemetry', 'How much the AI is used, how often people change its output, and what it costs.')}
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            ${tile('AI actions this month', actions.toLocaleString(), 'Sends plus captured items')}

            ${tile('Tag accuracy', tagKept + '%', 'Share of AI tags reps kept', tagKept >= 88 ? 'text-emerald-400' : 'text-amber-400')}
            ${tile('Human corrections', corr, 'Edits, dismissals, undos, rejections')}
            ${tile('Time saved', '15.3 hrs', 'Per rep per week • about 490 hrs for 32 reps', 'text-emerald-400')}
            ${tile('Cost per action', '$0.012', 'About $' + cost.toLocaleString() + ' per month')}
            ${tile('Latency (p95)', '1.8 s', 'Extraction and drafting')}
            ${tile('Review backlog', queueItemsAll().length, 'Below confidence threshold', queueItemsAll().length ? 'text-amber-400' : 'text-emerald-400')}
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="${cardCls} space-y-3">
                <h3 class="text-sm font-bold text-white">Sent unedited, by week</h3>
                <div class="flex items-end gap-2 h-28">${trend.map((s, i) => `<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end"><span class="text-[11px] font-mono text-zinc-400 tabular-nums">${s}%</span><div class="w-full rounded-t ${i === trend.length - 1 ? 'bg-brand-500' : 'bg-zinc-700'}" style="height:${Math.max(6, (s - 50) * 2)}%"></div><span class="text-[11px] font-mono text-zinc-500">${i === trend.length - 1 ? 'Now' : 'W-' + (trend.length - 1 - i)}</span></div>`).join('')}</div>
            </div>
            <div class="${cardCls} space-y-3">
                <h3 class="text-sm font-bold text-white">By team</h3>
                <div class="overflow-x-auto"><table class="w-full text-xs min-w-[420px]">${thead(['Team', 'Reps', 'AI actions', 'Sent unedited', 'Hrs saved / wk'])}
                    <tbody>${teams.map(t => `<tr class="border-b border-dark-border/60"><td class="py-2.5 pr-3 text-white font-semibold">${t.t}</td><td class="py-2.5 pr-3 text-zinc-300 tabular-nums">${t.n}</td><td class="py-2.5 pr-3 text-zinc-300 tabular-nums">${t.a}</td><td class="py-2.5 pr-3 font-mono text-zinc-300 tabular-nums">${t.u}%</td><td class="py-2.5 text-zinc-300 tabular-nums">${t.hrs}</td></tr>`).join('')}</tbody></table></div>
            </div>
        </div>
        <div class="${cardCls} space-y-3">

function stopAuto(id) { const t = state.tasks.find(x => x.id === id); if (!t) return; t.autoStopped = true; delete t.autoAt; showToast('Auto-send stopped'); rerenderQueue(); }
function tickAuto() {
    const now = Date.now();
    state.tasks.slice().forEach(t => {
        if (!t.autoAt || t.autoStopped || t.snoozedUntil) return;
        if (draftMode(t.type) !== 'auto') { delete t.autoAt; return; }
        const left = Math.ceil((t.autoAt - now) / 1000);
        const el = document.getElementById('auto-' + t.id);
        if (el) el.textContent = left > 0 ? 'Auto-sends in ' + left + 's' : 'Sending…';
        if (left <= 0) { t.autoSent = true; showToast('Auto-sent: ' + t.actionType); executeTask(t.id); }
    });
}

function refreshDeal() {
    if (!state.openDealId) return;
    const el = document.getElementById('cardDrawer'), y = el.scrollTop;
    openDeal(state.openDealId);
    el.scrollTop = y;
}
function setTlFilter(f) { state.dealUI.filter = f; state.dealUI.showAll = false; refreshDeal(); }
function setTlAll() { state.dealUI.showAll = true; refreshDeal(); }
function toggleTask(dealId, i) { const t = state.deals[dealId].tasks[i]; t.done = !t.done; refreshDeal(); }
function approveFromDeal(taskId, dealId) { executeTask(taskId); openDeal(dealId); }
function approveChanges(dealId) {
    const d = state.deals[dealId];
    const labels = d.fields.filter(f => f.status === 'pending').map(f => f.label);
    if (!labels.length) return;
    labels.forEach(l => applyResolve(dealId, l, 'accept'));
    showToast(labels.length + ' CRM change' + (labels.length === 1 ? '' : 's') + ' accepted');
    afterCorrection();
}

                <button onclick="openContact('${id}','${p.id}')" class="w-full text-left flex items-center justify-between gap-3 px-2 py-2 hover:bg-zinc-900 rounded-lg">
                    <div class="min-w-0"><p class="text-xs font-semibold text-white truncate">${p.name}</p><p class="text-[11px] text-zinc-500 truncate">${p.role} • ${p.title}</p></div>
                    <span class="px-1.5 py-0.5 rounded text-[11px] font-mono font-semibold shrink-0 ${NODE_STYLE[p.status].badge}">${NODE_STYLE[p.status].label}</span>
                </button>`).join('')}
            </div>
            <p class="text-[11px] text-zinc-500 tabular-nums">${cov.engaged} of ${cov.total} roles engaged</p>
        </div>` : ''}

        ${d.tasks && d.tasks.length ? `
        <div class="space-y-2">
            ${secHead('Tasks', '<span class="text-[11px] text-zinc-500 font-mono">Auto-created • click any field to edit</span>')}
            <div class="p-3.5 rounded-xl bg-dark-card border border-dark-border space-y-3">
                ${d.tasks.map((t, i) => `
                <div class="flex items-start gap-3">
                    <button onclick="toggleTask('${id}',${i})" aria-pressed="${!!t.done}" aria-label="Mark done" class="w-4 h-4 mt-1 rounded border shrink-0 flex items-center justify-center ${t.done ? 'bg-emerald-500 border-emerald-500' : 'border-zinc-600 hover:border-zinc-400'}">${t.done ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}</button>
                    <div class="flex-1 min-w-0 space-y-1 ${t.done ? 'opacity-50' : ''}">
                        <input value="${t.text}" aria-label="Task" oninput="editTask('${id}',${i},'text',this.value)" class="w-full bg-transparent text-xs text-zinc-200 rounded px-1 -mx-1 hover:bg-zinc-900 focus:bg-zinc-900 focus:outline-none focus:ring-1 focus:ring-brand-500/50 ${t.done ? 'line-through' : ''}">
                        <div class="flex items-center gap-1 text-[11px] font-mono text-zinc-500">
                            <input value="${t.owner}" aria-label="Owner" oninput="editTask('${id}',${i},'owner',this.value)" class="w-44 bg-transparent rounded px-1 -mx-1 hover:bg-zinc-900 focus:bg-zinc-900 focus:outline-none focus:ring-1 focus:ring-brand-500/50">
                            <span>• due</span>
                            <input value="${t.due}" aria-label="Due" oninput="editTask('${id}',${i},'due',this.value)" class="w-28 bg-transparent rounded px-1 hover:bg-zinc-900 focus:bg-zinc-900 focus:outline-none focus:ring-1 focus:ring-brand-500/50">
                        </div>
                    </div>
                </div>`).join('')}
            </div>
        </div>` : ''}

        <div class="space-y-3">
            ${secHead('Timeline', `<span class="text-[11px] text-emerald-400 font-mono">⚡ ${autoToday} auto-logged today</span>`)}
            <div class="inline-flex items-center gap-0.5 p-0.5 rounded-lg bg-zinc-900 border border-dark-border">${fchip('all', 'All')}${fchip('calls', 'Calls')}${fchip('emails', 'Emails')}${fchip('signals', 'Signals')}</div>
            ${shown.length ? `<ol class="space-y-4 border-l border-dark-border ml-1.5">${shown.map(e => timelineEntry(e, id)).join('')}</ol>` : `<p class="text-xs text-zinc-500">No entries match this filter.</p>`}
            ${!ui.showAll && tl.length > 5 ? `<button onclick="setTlAll()" class="text-[11px] text-brand-400 hover:text-brand-300 font-mono">Show all ${tl.length} entries</button>` : ''}
        </div>`);
    state.openDealId = id;
    autosizeGeneric();
    if (isCro()) applyReadOnly(id);
}

function openTranscript(dealId) {
    const d = state.deals[dealId];
    if (!d || !d.transcript) return;
    setDrawer(`
        <div class="flex items-start justify-between gap-3 pb-4 border-b border-dark-border">
            <div>
                <button onclick="openDeal('${dealId}')" class="text-[11px] text-brand-400 hover:text-brand-300 font-mono">← Back to ${d.name}</button>
                <h2 class="text-lg font-bold text-white mt-1">Call Transcript</h2>
                <p class="text-[11px] text-zinc-500 font-mono">Phone call • Discovery • 38 min • Today, 2:10pm</p>
            </div>
            ${closeBtn}
        </div>
        <div class="space-y-3">
            ${d.transcript.map(l => `<div class="p-3 rounded-lg ${l.who === 'You' ? 'bg-brand-500/5 border-brand-500/20' : 'bg-zinc-950 border-dark-border'} border"><p class="text-[11px] font-mono uppercase tracking-wider ${l.who === 'You' ? 'text-brand-400' : 'text-zinc-500'}">${l.who}</p><p class="text-xs text-zinc-200 mt-1">${l.text}</p></div>`).join('')}
            <p class="text-[11px] text-zinc-500 font-mono">Excerpt shown. The full transcript is stored on the opportunity.</p>
        </div>`);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function executeTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    state.tasks = state.tasks.filter(x => x.id !== id);
    if (state.selTask === id) state.selTask = null;
    const d = t.dealId ? state.deals[t.dealId] : null;
    const eff = effectsFor(t);
    const off = e => t.skip && t.skip[e.id];
    const did = eff.filter(e => !off(e) && e.kind !== 'Follow-up'), skipped = eff.filter(e => off(e));
    const wantFu = !t.isFollowUp && !(t.skip && t.skip.fu);
    if (d) {
        const txt = 'Approved and executed: ' + t.actionType
            + (did.length ? '. Also done: ' + did.map(e => e.text).join('; ') : '')
            + (skipped.length ? '. Skipped by you: ' + skipped.map(e => e.text).join('; ') : '')
            + (wantFu ? '. Follow-up scheduled in 3 days.' : '');
        d.timeline.unshift({ when: 'Just now', today: true, src: 'Action Queue', text: txt, tags: [] });
    }
    if (t.link) {
        const p = state.comm[t.link.acct].people.find(x => x.id === t.link.pid);
        if (p) { p.status = 'engaged'; p.note = 'Outreach sent • awaiting reply'; }
    }
    { const st = state.sendStats[t.type]; const ed = t.draftOriginal !== undefined && t.draft !== t.draftOriginal; if (st) { st.sent += 1; if (ed) st.edited += 1; } state.liveSent += 1; if (ed) state.liveEdited += 1; }
    state.done.unshift({ account: t.account, actionType: t.actionType, time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), type: t.type });
    pushFeed({ src: 'crm', kind: 'log', dealId: t.dealId, title: 'Action executed: ' + t.account.split(' (')[0], text: t.actionType, mutation: did.length ? did.map(e => e.text).join(' • ') : 'Message sent',
        field: 'Message sent', before: 'Draft', after: t.msg ? t.msg.to : t.account.split(' (')[0], evidence: t.autoSent ? 'Sent automatically under RevOps policy' : (t.draftOriginal !== undefined && t.draft !== t.draftOriginal ? 'Draft edited by the rep before sending' : 'Draft sent unedited'), approver: t.autoSent ? 'Policy (auto-send)' : actor(), outcome: 'Applied' });
    if (wantFu) {
        const bd = { immediacy: 40, impact: 50, size: 50 };
        state.tasks.push({
            id: 'fu-' + t.id, dealId: t.dealId, type: 'followup', isFollowUp: true, dueLabel: 'due in 3 days',
            headline: 'Check for a reply', reasons: ['Scheduled follow-up'], breakdown: bd, score: calcScore(bd), due: { label: 'Due in 3 days', group: 'later' },
            why: 'Scheduled 3 days after your last outreach',
            account: t.account, title: 'Follow-Up • Check for Reply',
            desc: 'You acted on "' + t.actionType + '". If there is no reply in 3 days, this nudge is ready to send.',
            actionType: 'Send Nudge if No Reply', channel: t.channel,
            draft: 'Just following up on my last note. Happy to answer any questions or find a time that works for you.',
            stageUpdate: 'Follow-up logged',
            crmMutations: ['Logs follow-up activity', 'Sets the next follow-up for 3 days later'],
            transcriptSnippet: 'You sent: "' + t.draft + '"',
            msg: { to: t.msg ? t.msg.to : t.account.split(' (')[0], channel: t.channel, subject: t.msg && t.msg.subject ? 'Re: ' + t.msg.subject : undefined, also: [] },
            draftOriginal: 'Just following up on my last note. Happy to answer any questions or find a time that works for you.',
            followUpOf: {
                action: t.actionType,
                when: 'today, ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
                channel: t.channel,
                excerpt: t.draft.length > 110 ? t.draft.slice(0, 110) + '…' : t.draft
            }
        });
    }
    showToast(t.isFollowUp ? 'Task Executed & Auto-Logged to CRM' : (wantFu ? 'Message sent and logged. Follow-up scheduled for 3 days from now.' : 'Message sent and logged. No follow-up scheduled.'));
    renderAll();
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.setAttribute('role', 'status');
    toast.className = 'fixed bottom-5 right-5 bg-brand-600 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow-xl z-[60] flex items-center gap-2 fade-in';
    toast.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> ${msg}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

function resetDemo() {
    const keepP = currentPersona, keepM = currentModule;
    initState();
    switchPersona(keepP);
    if (keepM !== currentModule && PERSONAS[keepP].modules.includes(keepM)) { currentModule = keepM; renderAll(); }
    showToast('Demo reset to its starting state');
}

function setRole(acct, pid, val) {
    const p = state.comm[acct].people.find(x => x.id === pid); if (!p || p.role === val) return;
    const was = p.role; p.role = val; p.roleReviewed = true; logCorrection('Roles or status changed');
    auditCorr(acct, 'Role corrected: ' + p.name, 'Contact role', was, val);
    showToast('Role updated. Logged as an AI correction.');
    renderContact(); afterCorrection();
}
function setStatus(acct, pid, val) {
    const p = state.comm[acct].people.find(x => x.id === pid); if (!p || p.status === val) return;
    const was = p.status; p.status = val; logCorrection('Roles or status changed');
    auditCorr(acct, 'Engagement corrected: ' + p.name, 'Engagement', was, val);
    showToast('Engagement updated. Logged as an AI correction.');
    renderContact(); afterCorrection();
}
function openContact(acct, pid) {
    state.contact = { acct, pid };
    contactReturnFocus = document.activeElement;
    renderContact();
    const m = document.getElementById('contactModal');
    m.classList.remove('hidden'); m.classList.add('flex');
    document.getElementById('contactCard').focus({ preventScroll: true });
}
function closeContact() {
    const m = document.getElementById('contactModal');
    m.classList.add('hidden'); m.classList.remove('flex');
    state.contact = null;
    const r = contactReturnFocus; contactReturnFocus = null;
    if (r && document.contains(r) && r.focus) r.focus({ preventScroll: true });
}
function renderContact() {
    if (!state.contact) return;
    const { acct, pid } = state.contact;
    const d = state.deals[acct];
    const p = state.comm[acct].people.find(x => x.id === pid);
    const ci = contactInfo(acct, p), st = NODE_STYLE[p.status];
    const initials = p.id === 'champ' ? '?' : p.name.split(' ').map(w => w[0]).join('').slice(0, 2);
    const canEngage = p.status === 'none' || p.status === 'cooling';
    document.getElementById('contactCard').innerHTML = `
        <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-12 h-12 rounded-full bg-brand-600/20 border border-brand-500/30 text-brand-300 flex items-center justify-center font-bold shrink-0">${initials}</div>
                <div class="min-w-0">
                    <h2 class="text-base font-bold text-white truncate">${p.name}</h2>
                    <p class="text-xs text-zinc-400">${p.title}</p>
                    <p class="text-[11px] text-zinc-500">${d.name}</p>
                </div>
            </div>
            <button onclick="closeContact()" aria-label="Close" class="text-zinc-400 hover:text-white p-1 rounded-lg bg-zinc-900 border border-dark-border shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
        <div class="grid grid-cols-2 gap-3 text-[11px]">
            <label class="space-y-1"><span class="text-zinc-500 block">Role ${p.auto ? '<span class="text-zinc-500">• AI-inferred</span>' : ''}</span>
                <select onchange="setRole('${acct}','${pid}',this.value)" class="w-full bg-zinc-900 border border-dark-border rounded px-2 py-1.5 text-xs text-zinc-200">${ROLES.map(r => `<option ${r === p.role ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
            <label class="space-y-1"><span class="text-zinc-500 block">Engagement</span>
                ${p.status === 'queued' ? `<span class="inline-block px-2 py-1.5 rounded text-[11px] font-mono font-semibold ${st.badge}">${st.label}</span>` : `<select onchange="setStatus('${acct}','${pid}',this.value)" class="w-full bg-zinc-900 border border-dark-border rounded px-2 py-1.5 text-xs text-zinc-200">${[['engaged', 'Engaged'], ['cooling', 'Cooling'], ['none', 'Not engaged']].map(([v, l]) => `<option value="${v}" ${v === p.status ? 'selected' : ''}>${l}</option>`).join('')}</select>`}</label>
        </div>
        ${p.auto && p.roleConf < thr('Contact roles') && !p.roleReviewed ? `<div class="flex items-center justify-between gap-3 p-2.5 rounded-lg bg-sky-500/5 border border-sky-500/30"><p class="text-[11px] text-sky-200">AI is ${p.roleConf}% sure about this role.</p><button onclick="confirmRole('${acct}','${pid}')" class="px-3 py-1 rounded-lg bg-sky-500/20 hover:bg-sky-500/30 text-sky-200 text-[11px] font-semibold border border-sky-500/40">Confirm</button></div>` : ''}
        <div class="p-3.5 rounded-xl bg-zinc-950 border border-dark-border space-y-2 text-xs">
            <div class="flex justify-between gap-3"><span class="text-zinc-500">Email</span><span class="text-zinc-200 font-mono select-all">${ci.email || 'Not yet identified'}</span></div>
            <div class="flex justify-between gap-3"><span class="text-zinc-500">Phone</span><span class="text-zinc-200 font-mono select-all">${ci.phone || 'Not yet identified'}</span></div>
            <div class="flex justify-between gap-3"><span class="text-zinc-500">Last touch</span><span class="text-zinc-200">${ci.last}</span></div>
        </div>
        <div class="space-y-1.5">
            <h4 class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Recent activity</h4>
            <ul class="space-y-1">${ci.activity.map(a => `<li class="text-xs text-zinc-300 flex items-start gap-2"><span class="w-1.5 h-1.5 rounded-full bg-zinc-600 shrink-0 mt-1.5"></span>${a}</li>`).join('')}</ul>
        </div>
        ${canEngage ? `<button onclick="engagePerson('${acct}','${pid}'); renderContact();" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold">${p.status === 'cooling' ? 'Re-engage' : (p.role === 'Technical Champion' ? 'Engage via introduction' : 'Engage now')}</button>
            <p class="text-[11px] text-zinc-500 text-center">Drafts an intro and adds it to your Action Queue for approval.</p>` : ''}
        ${p.status === 'queued' ? `<p class="text-xs text-brand-300 text-center font-mono">Outreach queued in your Action Queue</p>` : ''}`;
    const noAdd = el => { el.querySelectorAll('p').forEach(x => { if (/adds it to your Action Queue/.test(x.textContent)) x.remove(); }); };
    if (isCro()) {
        const cc = document.getElementById('contactCard');
        cc.querySelectorAll('select').forEach(x => { x.disabled = true; });
        cc.querySelectorAll('button[onclick^="engagePerson("]').forEach(b => { b.setAttribute('onclick', "askAE('" + acct + "','engage'); closeContact()"); b.textContent = 'Ask AE to engage'; });
        cc.querySelectorAll('button[onclick^="confirmRole("]').forEach(b => b.remove());
        noAdd(cc);
    } else if (currentPersona === 'revops') {
        const cc = document.getElementById('contactCard');
        cc.querySelectorAll('button[onclick^="engagePerson("]').forEach(b => b.remove());
        noAdd(cc);
    }
}

document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.contact) closeContact();
    else if (!document.getElementById('cardDrawer').classList.contains('translate-x-full')) closeDrawer();
    else toggleCtx(false);
});
document.addEventListener('focusin', e => {
    const cm = document.getElementById('contactModal'), dr = document.getElementById('cardDrawer');
    if (!cm.classList.contains('hidden')) { if (!cm.contains(e.target)) document.getElementById('contactCard').focus({ preventScroll: true }); }
    else if (!dr.classList.contains('translate-x-full') && !dr.contains(e.target)) dr.focus({ preventScroll: true });
});

/* =====================================================================
   BOOT
   ===================================================================== */
initState();

switchPersona('ae');
streamTimer = setInterval(streamTick, 8000);
setInterval(tickAuto, 1000);
</script>

</body>
</html>
