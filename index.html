<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Driving Revenue Engine | Next-Gen AI CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        dark: {
                            bg: '#09090b',
                            card: '#141417',
                            border: '#27272a',
                            hover: '#202024',
                            muted: '#a1a1aa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #141417;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
        .fade-in {
            animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-dark-bg text-zinc-100">

    <!-- TOP NAV / GLOBAL BAR -->
    <header class="h-14 border-b border-dark-border bg-dark-card/90 backdrop-blur-md px-4 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <div>
                <span class="font-bold text-sm sm:text-base tracking-tight text-white flex items-center gap-2">
                    Self-Driving CRM
                    <span class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/30">v2.4 Active Engine</span>
                </span>
            </div>
        </div>

        <!-- PERSONA SWITCHER DROPDOWN -->
        <div class="flex items-center gap-2 bg-zinc-900/90 border border-dark-border px-3 py-1.5 rounded-xl shadow-inner">
            <span class="text-[11px] font-medium text-zinc-400 uppercase tracking-wider hidden sm:inline">Active Persona:</span>
            <select id="personaSelector" onchange="switchPersona(this.value)" class="bg-transparent text-xs font-semibold text-brand-400 focus:outline-none cursor-pointer py-0.5 pr-2">
                <option value="ae" class="bg-zinc-900 text-zinc-200">Account Executive (AE)</option>
                <option value="cro" class="bg-zinc-900 text-zinc-200">Chief Revenue Officer (CRO)</option>
                <option value="revops" class="bg-zinc-900 text-zinc-200">RevOps Leader</option>
            </select>
        </div>

        <!-- Global Telemetry Status -->
        <div class="hidden lg:flex items-center gap-6 text-xs text-zinc-400">
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-900/60 border border-dark-border">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="font-medium text-zinc-200">Zero-Touch Capture Active</span>
            </div>
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>Admin Reclaimed: <strong class="text-white font-semibold" id="timeSavedCounter">21.8 hrs/rep/wk</strong></span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div id="userPersonaBadge" class="h-8 px-3 rounded-lg bg-indigo-950/60 border border-brand-500/40 flex items-center justify-center text-xs font-semibold text-brand-300">
                AE Execution Mode
            </div>
        </div>
    </header>

    <!-- MAIN BODY CONTAINER -->
    <div class="flex-1 flex overflow-hidden">

        <!-- SIDEBAR NAVIGATION -->
        <aside class="w-60 border-r border-dark-border bg-dark-card flex flex-col justify-between shrink-0 z-10">
            <div class="p-3 space-y-5">
                <!-- Org Context Card -->
                <div class="p-2.5 rounded-lg bg-zinc-900/90 border border-dark-border flex items-center justify-between">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <div class="w-7 h-7 rounded-lg bg-brand-600/20 border border-brand-500/30 text-brand-400 flex items-center justify-center text-xs font-bold shrink-0">
                            A
                        </div>
                        <div class="truncate">
                            <p class="text-xs font-semibold text-zinc-200 truncate">Acme Tech Systems</p>
                            <p class="text-[10px] text-zinc-400 truncate" id="sidebarRoleLabel">AE Workspace • 32 Reps</p>
                        </div>
                    </div>
                </div>

                <!-- Nav Buttons -->
                <nav class="space-y-1" id="dynamicSidebarNav"></nav>
            </div>

            <!-- Health Indicator Footer -->
            <div class="p-3 border-t border-dark-border bg-zinc-950/50">
                <div class="p-3 rounded-lg bg-zinc-900/60 border border-dark-border space-y-2">
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-zinc-400 font-medium">Model Sync Latency</span>
                        <span class="text-emerald-400 font-mono font-semibold">142ms</span>
                    </div>
                    <div class="w-full bg-zinc-800 rounded-full h-1.5 overflow-hidden">
                        <div class="bg-emerald-500 h-1.5 rounded-full w-[94%]"></div>
                    </div>
                    <p class="text-[10px] text-zinc-500">Autonomous CRM Sync Engine 100% Operational</p>
                </div>
            </div>
        </aside>

        <!-- MAIN EXECUTION CANVAS -->
        <main class="flex-1 flex flex-col bg-dark-bg overflow-y-auto" id="mainCanvas"></main>

        <!-- RIGHT CONTEXTUAL INTELLIGENCE PANEL -->
        <aside class="w-80 border-l border-dark-border bg-dark-card flex flex-col justify-between shrink-0 hidden xl:flex" id="rightContextPanel"></aside>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        let currentPersona = 'ae';
        let currentModule = 'actionQueue';
        let aePendingTasks = [
            { 
                id: 'card-1', 
                account: 'Acme Corp ($180k ACV)', 
                title: 'Champion Silent • Exec Escalation', 
                desc: 'Marcus Vance (VP Eng) missed key evaluation sync. Competitor pricing page traffic detected.', 
                actionType: 'Exec Escalation (CRO Peer Email + Slack Alert)',
                channel: 'Email + Slack Alert',
                draft: 'Marcus — standardizing on compliance automation usually comes down to developer bandwidth saved. Can I share our benchmark report?', 
                type: 'rose',
                stageUpdate: 'Stage: Discovery ➔ Executive Alignment',
                crmMutations: ['Logs CRO Outreach Activity', 'Notifies Sales Channel #deal-acme-corp', 'Sets Follow-up to 48 Hours'],
                transcriptSnippet: '"We are struggling to get buy-in from security, and engineering bandwidth is pulled into Q3 launch..." — Marcus V. (Call on Oct 14)'
            },
            {

                title: 'InfoSec Block • Stage Mutation', 
                desc: 'InfoSec team requested ISO-27001 SOC2 Type II mapping document for Q4 signoff.', 
                actionType: 'Dispatch ISO Package & Mutate CRM Stage',

                actionType: 'Auto-Schedule Technical Workshop (AE + SE Slots)',
                channel: 'Calendar Multi-Party Invite',
                draft: 'David — thanks for the time today. I have reserved 3 slots for our technical alignment deep dive with our lead SE.', 
                type: 'indigo',
                stageUpdate: 'Stage: Demo Complete ➔ Tech Alignment Scheduled',
                crmMutations: ['Sends Calendar Invite (Thu 2pm / Fri 10am)', 'Logs Auto-Extracted Meeting Notes', 'Tags Solutions Engineer'],
                transcriptSnippet: '"The core feature looks solid, but we need our lead architect to verify the API webhook latency requirements."'
            },
            {
                id: 'card-4',
                account: 'Vortex Systems ($95k ACV)',
                title: 'Dark Intent Signal • Multi-Channel Drop',
                desc: 'Procurement team viewed terms page 4x in 24 hrs. Email response rate dropping.',
                actionType: 'LinkedIn InMail / WhatsApp Drop & Risk Rescore',

                stageUpdate: 'Stage: Negotiation ➔ Contracting Fast-Track',

        let activeDrawerTask = null;

        const modulesConfig = {

            accounts: { id: 'accounts', label: 'Account Graphs', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
            telemetry: { id: 'telemetry', label: 'Telemetry', tag: 'ARR Diagnostics', icon: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' },
            settings: { id: 'settings', label: 'Settings', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z' }
        };

        const personaProfiles = {
            ae: {
                badge: 'AE Execution Mode',
                label: 'AE Workspace • 32 Reps',
                defaultModule: 'actionQueue',
                modules: ['actionQueue', 'pipeline', 'accounts']
            },
            cro: {
                badge: 'CRO Command Center',
                label: 'Executive RevOps',
                defaultModule: 'pipeline',
                modules: ['pipeline', 'telemetry', 'accounts']
            },
            revops: {
                badge: 'RevOps System Control',
                label: 'Schema & Ingestion Infra',
                defaultModule: 'settings',
                modules: ['telemetry', 'settings', 'accounts']
            }
        };

        function switchPersona(personaKey) {
            currentPersona = personaKey;
            currentModule = personaProfiles[personaKey].defaultModule;
            
            document.getElementById('userPersonaBadge').innerText = personaProfiles[personaKey].badge;
            document.getElementById('sidebarRoleLabel').innerText = personaProfiles[personaKey].label;

            renderSidebar();
            renderMainCanvas();
            renderRightContext();
        }

        function switchTab(modId) {
            currentModule = modId;
            renderSidebar();
            renderMainCanvas();
            renderRightContext();
        }

        function renderSidebar() {
            const nav = document.getElementById('dynamicSidebarNav');
            const allowed = personaProfiles[currentPersona].modules;

            nav.innerHTML = `
                <p class="px-3 text-[10px] font-semibold text-zinc-500 uppercase tracking-wider mb-2">Modules</p>
                ${allowed.map(modId => {
                    const mod = modulesConfig[modId];
                    const isActive = modId === currentModule;
                    return `
                        <button onclick="switchTab('${mod.id}')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all ${isActive ? 'bg-brand-500/10 text-brand-400 border border-brand-500/30 font-semibold' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'}">

                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${mod.icon}"/></svg>
                                <span>${mod.label}</span>
                            </div>
                            ${mod.badge && aePendingTasks.length > 0 ? `<span class="bg-brand-600 text-white px-1.5 py-0.2 rounded-full text-[10px] font-bold">${aePendingTasks.length}</span>` : ''}

            `;
        }

        function renderMainCanvas() {
            const canvas = document.getElementById('mainCanvas');

            if (currentModule === 'actionQueue') {
                canvas.innerHTML = `
                    <div class="p-6 space-y-6 fade-in max-w-5xl">
                        <div class="flex items-center justify-between pb-4 border-b border-dark-border">

                            </div>

                        ${aePendingTasks.length === 0 ? `
                            <div class="p-12 text-center rounded-xl bg-dark-card border border-dark-border">
                                <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto mb-3">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                </div>
                                <h3 class="text-base font-bold text-white">Queue Empty! All Actions Cleared</h3>

                                            <div class="flex items-center gap-2">
                                                <span class="px-2 py-0.5 rounded text-[11px] font-semibold uppercase tracking-wider bg-brand-500/10 text-brand-400 border border-brand-500/20 font-mono">${task.title}</span>

                                    <div class="flex justify-between text-xs font-bold text-white"><span>TechFlow Inc</span><span>$140k ACV</span></div>
                                    <div class="flex justify-between text-[10px] text-zinc-400 font-mono"><span>Closing Probability</span><span class="text-emerald-400">92% (High)</span></div>
                                </div>
                                <div class="p-3 rounded-lg bg-zinc-900 border border-dark-border space-y-1">
                                    <div class="flex justify-between text-xs font-bold text-white"><span>Vortex AI</span><span>$95k ACV</span></div>
                                    <div class="flex justify-between text-[10px] text-zinc-400 font-mono"><span>Closing Probability</span><span class="text-zinc-300">74% (Medium)</span></div>
                                </div>
                            </div>

                            <div class="p-4 rounded-xl bg-dark-card border border-dark-border space-y-3">
                                <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider flex justify-between">Stage: Procurement & Legal <span class="text-brand-400">2 Deals</span></h3>
                                <div class="p-3 rounded-lg bg-zinc-900 border border-rose-500/30 space-y-1">

            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
